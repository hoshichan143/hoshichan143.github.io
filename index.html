<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="container" class="display-flex">
      <div id="blackoutCover" class="hidden fadingElement"></div>
      <!--↑暗転用空要素 -->
      <!--以下、初期状態で表示されている要素 -->
      <div id="formPage" class="display-flex">
        <div id="header">今日は何する～？</div>
        <div id="divTodoList">
          <ul id="ulTodoList"></ul>
        </div>
        <div id="buttons">
          <button type="button" id="rouletteBtn" class="btn">回す！</button>
          <button type="button" id="addListBtn" class="btn">増やす</button>
        </div>
      </div>

      <div id="hiddenPage" class="display-flex hidden fadingElement">
        <!-- 以下、「回す」ボタンを押すまで非表示の要素 -->
        <div id="rouletteArea" class="display-flex">
          <svg
            width="100%"
            height="100%"
            viewBox="0 0 100 100"
            id="svgRouletteBase"
            class="hidden fadingElement"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- ドロップシャドウを定義 -->
            <defs>
              <!-- 影が途切れるのでwとhを既定より拡大　乗算で合成する -->
              <filter id="shadow" x="-20%" y="-10%" width="200%" height="200%">
                <feDropShadow
                  dx="0"
                  dy="0"
                  stdDeviation="1"
                  flood-opacity="0.8"
                  flood-color="SteelBlue"
                  result="dropShadow"
                />
                <!--<feBlend in="SourceGraphic" in2="dropShadow" mode="screen" />-->
              </filter>
            </defs>
            <g id="svgRouletteBoard" xmlns="http://w3.org">
              <circle
                cx="50"
                cy="50"
                r="40"
                fill="blue"
                id="svgRouletteCircle"
                filter="url(#shadow)"
              />
            </g>
            <polygon
              points="47,7.5 53,7.5 50,12.7"
              fill="red"
              stroke="white"
              stroke-width="0.7"
              id="svgRouletteTri"
              filter="url(#shadow)"
            />
          </svg>
        </div>

        <div id="resultTexts" class="display-none hidden fadingElement">
          <div id="resultText1" class="hidden fadingElement resultText"></div>
          <div id="resultText2" class="hidden fadingElement resultText"></div>
          <div id="resultText3" class="hidden fadingElement resultText"></div>
        </div>
        <div id="hiddenBtnStp" class="display-flex">
          <!-- 回す」ボタンを押すまで非表示の要素 -->
          <button type="button" id="stopBtn" class="hidden fadingElement btn">
            止める！
          </button>
        </div>
        <div id="hiddenBtnResult" class="display-none">
            <!--「止める」ボタンによる値確定後に表示する要素 -->
          <button type="button" id="againBtn" class="hidden fadingElement btn">
            もう一度回す
          </button>
          <button type="button" id="returnBtn" class="hidden fadingElement btn">
            戻る
          </button>
        </div>
          
        </div>
      </div>
    </div>
    <script src="./JS/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </body>
</html>
